[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hidrogreen-detectionservice"
version = "0.0.1"
description = "Service to detect the desease of the plant using the model"
authors = ["Diego22rct <diegorafaelcisnerostafur@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.12"}
python-multipart = "^0.0.20"
tensorflow = "^2.19.0"
pillow = "^11.2.1"
py-eureka-client = "^0.11.13"
pika = "^1.3.2"
requests = "^2.31.0"

