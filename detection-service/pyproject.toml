[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "hidrogreen-detectionservice"
version = "2.0.0"
description = "Service to detect plant diseases using AI model with DDD and CQRS architecture"
authors = ["Diego22rct <diegorafaelcisnerostafur@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.12"}
python-multipart = "^0.0.20"
tensorflow = "^2.19.0"
pillow = "^11.2.1"
py-eureka-client = "^0.11.13"
pika = "^1.3.2"
requests = "^2.31.0"
sqlalchemy = "^2.0.23"
pymysql = "^1.1.0"
cloudinary = "^1.40.0"
python-dotenv = "^1.0.0"
uvicorn = "^0.27.1"
certifi = "^2025.7.9"
aiohttp = "^3.12.14"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
flake8 = "^6.0.0"
mypy = "^1.0.0"

[tool.black]
line-length = 88
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

