# Configuración optimizada para builds rápidos
version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: hidrogreen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ayni
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --bind-address=0.0.0.0
    networks:
      - hidrogreen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hidrogreen-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - hidrogreen-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 30s
      retries: 3

  # Microservicios
  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: hidrogreen-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - hidrogreen-network
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: hidrogreen-user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  treatment-service:
    build:
      context: ./treatment-service
      dockerfile: Dockerfile
    container_name: hidrogreen-treatment-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db
      - rabbitmq
      - discovery-service
      - user-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  crop-service:
    build:
      context: ./crop-service
      dockerfile: Dockerfile
    container_name: hidrogreen-crop-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db
      - rabbitmq
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  detection-service:
    build:
      context: ./detection-service
      dockerfile: Dockerfile
    container_name: hidrogreen-detection-service
    ports:
      - "8000:8000"
    environment:
      - EUREKA_SERVER=http://discovery-service:8761/eureka/
      - SERVICE_HOST=detection-service
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - USER_SERVICE_URL=http://user-service:8081
    depends_on:
      - discovery-service
      - rabbitmq
      - user-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: hidrogreen-report-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: hidrogreen-notification-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Variables de entorno para servicios externos
      - EMAIL_USERNAME=${EMAIL_USERNAME:-contact.pocketpartners@gmail.com}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD:-dummy_password}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-contact.pocketpartners@gmail.com}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-ACdummy_account_sid_for_development}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-dummy_auth_token_for_development}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}

    depends_on:
      - mysql-db
      - rabbitmq
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  subscription-service:
    build:
      context: ./subscription-service
      dockerfile: Dockerfile
    container_name: hidrogreen-subscription-service
    ports:
      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mysql-db
      - rabbitmq
      - discovery-service
      - user-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  payment-gateway:
    build:
      context: ./hidrogreen-payment-gateway-service
      dockerfile: Dockerfile
    container_name: hidrogreen-payment-gateway
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: hidrogreen-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - discovery-service
    networks:
      - hidrogreen-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  hidrogreen-network:
    driver: bridge
