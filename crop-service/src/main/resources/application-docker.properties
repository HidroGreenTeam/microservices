# Docker Profile Configuration for Crop Service
server.port=8082
spring.application.name=crop-service

# Eureka Configuration for Docker
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-service:8761/eureka}
eureka.instance.hostname=${SERVICE_HOST:crop-service}
eureka.instance.prefer-ip-address=true

# Database Configuration for Docker
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3307/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.ayni.crop_service.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# RabbitMQ Configuration for Docker
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.crops=crops.exchange
rabbitmq.queue.crop-updates=crop.updates
rabbitmq.routing.key.crop=crop.update

# Detection Service Configuration for Docker
detection.service.url=http://detection-service:8000/api/v1/detections
detection.service.confidence.threshold=0.7

# User Service Configuration for Docker
user.service.url=http://user-service:8081

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# JWT Configuration Properties
authorization.jwt.secret=${JWT_SECRET:TempSecretForDevelopmentOnly123456789}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Service-to-Service Authentication
service.auth.secret=${SERVICE_AUTH_SECRET:ServiceSecretForInternalCommunication123}
service.auth.expiration.hours=${SERVICE_AUTH_EXPIRATION_HOURS:24}

# SpringDoc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Bean Definition Override
spring.main.allow-bean-definition-overriding=true

# Multipart File Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.resolve-lazily=false

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:default}
cloudinary.api-key=${CLOUDINARY_API_KEY:default}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:default}

# Feign Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.crop_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG 