# Server Configuration
server.port=8085
spring.application.name=crop-service

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://discovery-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:crop-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io}
eureka.instance.securePortEnabled=true
eureka.instance.securePort=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.instance.nonSecurePortEnabled=false
eureka.instance.preferIpAddress=false
eureka.instance.statusPageUrl=https://${eureka.instance.hostname}/actuator/info
eureka.instance.healthCheckUrl=https://${eureka.instance.hostname}/actuator/health
eureka.instance.homePageUrl=https://${eureka.instance.hostname}/

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.ayni.crop_service.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.crops=crops.exchange
rabbitmq.queue.crop-updates=crop.updates
rabbitmq.routing.key.crop=crop.update

# Detection Service Configuration
detection.service.url=https://detection-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/api/v1/detections
detection.service.confidence.threshold=0.7

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.crop_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# SpringDoc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI/Swagger is configured directly in Java code 