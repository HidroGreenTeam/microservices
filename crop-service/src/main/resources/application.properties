# Server Configuration
server.port=8085
spring.application.name=crop-service

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=com.ayni.crop_service.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.crops=crops.exchange
rabbitmq.queue.crop-updates=crop.updates
rabbitmq.routing.key.crop=crop.update

# Detection Service Configuration
detection.service.url=http://detection-service:8000/api/v1/detections
detection.service.confidence.threshold=0.7

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.crop_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# SpringDoc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI/Swagger is configured directly in Java code 