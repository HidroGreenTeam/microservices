# Production Profile Configuration - Crop Service (Azure)
# Eureka Client Configuration for Azure
eureka.client.service-url.defaultZone=https://discovery-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:crop-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io}
eureka.instance.securePortEnabled=true
eureka.instance.securePort=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.instance.nonSecurePortEnabled=false
eureka.instance.preferIpAddress=false
eureka.instance.statusPageUrl=https://${eureka.instance.hostname}/actuator/info
eureka.instance.healthCheckUrl=https://${eureka.instance.hostname}/actuator/health
eureka.instance.homePageUrl=https://${eureka.instance.hostname}/

# Database Configuration for Azure
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# RabbitMQ Configuration for Azure
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Detection Service Configuration for Azure
detection.service.url=https://detection-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/api/v1/detections 