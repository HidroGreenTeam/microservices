# Server Configuration
server.port=8084
spring.application.name=notification-service

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.queue.activity-notifications=activity.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.routing.key.activity=activity.reminder
rabbitmq.routing.key.treatment=treatment.reminder

# Email Configuration - Gmail SMTP (usando variables de entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:contact.pocketpartners@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
management.health.mail.enabled=false

# Configuración de remitente por defecto
email.from.name=HidroGreen Notifications
email.from.address=${EMAIL_FROM_ADDRESS:contact.pocketpartners@gmail.com}

# Twilio Configuration (usando variables de entorno)
# Para obtener estas credenciales, regístrate en https://www.twilio.com/
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Firebase Push Notifications Configuration (usando variables de entorno)
# Obtén tu Server Key desde Firebase Console > Project Settings > Cloud Messaging
firebase.server-key=${FIREBASE_SERVER_KEY:your_firebase_server_key_here}
firebase.fcm-url=https://fcm.googleapis.com/fcm/send

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.notification_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

