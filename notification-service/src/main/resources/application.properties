# Server Configuration
server.port=8084
spring.application.name=notification-service

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://discovery-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:notification-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io}
eureka.instance.securePortEnabled=true
eureka.instance.securePort=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.instance.nonSecurePortEnabled=false
eureka.instance.preferIpAddress=false
eureka.instance.statusPageUrl=https://${eureka.instance.hostname}/actuator/info
eureka.instance.healthCheckUrl=https://${eureka.instance.hostname}/actuator/health
eureka.instance.homePageUrl=https://${eureka.instance.hostname}/

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.queue.activity-notifications=activity.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.routing.key.activity=activity.reminder
rabbitmq.routing.key.treatment=treatment.reminder

# Email Configuration - Gmail SMTP (usando variables de entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:contact.pocketpartners@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
management.health.mail.enabled=false

# Configuración de remitente por defecto
email.from.name=HidroGreen Notifications
email.from.address=${EMAIL_FROM_ADDRESS:contact.pocketpartners@gmail.com}

# Twilio Configuration (usando variables de entorno)
# Para obtener estas credenciales, regístrate en https://www.twilio.com/
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Firebase Push Notifications Configuration (usando variables de entorno)
# Obtén tu Server Key desde Firebase Console > Project Settings > Cloud Messaging
firebase.server-key=${FIREBASE_SERVER_KEY:your_firebase_server_key_here}
firebase.fcm-url=https://fcm.googleapis.com/fcm/send

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.notification_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG

# OpenAPI/Swagger is configured directly in Java code

# Internal Service Token Configuration
service.internal.token=HIDROGREEN_INTERNAL_SERVICE_TOKEN_2024
