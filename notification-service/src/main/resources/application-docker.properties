# Docker Profile Configuration - Notification Service
# Eureka Client Configuration for Docker
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.hostname=notification-service
eureka.instance.prefer-ip-address=true
eureka.instance.securePortEnabled=false
eureka.instance.nonSecurePortEnabled=true
eureka.instance.statusPageUrl=http://${eureka.instance.hostname}:${server.port}/actuator/info
eureka.instance.healthCheckUrl=http://${eureka.instance.hostname}:${server.port}/actuator/health
eureka.instance.homePageUrl=http://${eureka.instance.hostname}:${server.port}/

# Database Configuration for Docker
spring.datasource.url=jdbc:mysql://mysql-db:3306/ayni?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# RabbitMQ Configuration for Docker
spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# RabbitMQ Queues and Exchanges
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.queue.activity-notifications=activity.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.routing.key.activity=activity.reminder
rabbitmq.routing.key.treatment=treatment.reminder

# Email Configuration - Gmail SMTP (usando variables de entorno)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:contact.pocketpartners@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:dummy_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false
management.health.mail.enabled=false

# Configuración de remitente por defecto
email.from.name=HidroGreen Notifications
email.from.address=${EMAIL_FROM_ADDRESS:contact.pocketpartners@gmail.com}

# Twilio Configuration (usando variables de entorno)
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_auth_token_here}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}

# Feign Configuration
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.ayni.notification_service=DEBUG
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG
logging.level.org.springframework.mail=DEBUG

# OpenAPI/Swagger is configured directly in Java code
