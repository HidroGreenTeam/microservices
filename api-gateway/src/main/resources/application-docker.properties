# Docker Profile Configuration - API Gateway
# Eureka Client Configuration for Docker
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka/
eureka.instance.hostname=api-gateway
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.securePortEnabled=false
eureka.instance.nonSecurePortEnabled=true
eureka.instance.preferIpAddress=true
eureka.instance.statusPageUrl=http://${eureka.instance.hostname}:${server.port}/actuator/info
eureka.instance.healthCheckUrl=http://${eureka.instance.hostname}:${server.port}/actuator/health
eureka.instance.homePageUrl=http://${eureka.instance.hostname}:${server.port}/ 