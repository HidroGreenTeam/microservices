spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: farmers-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/farmers/**
            - id: roles-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/roles/**
            - id: crop-service
              uri: lb://crop-service
              predicates:
                - Path=/api/v1/crops/**
            - id: diagnosis-service
              uri: lb://crop-service
              predicates:
                - Path=/api/v1/diagnosis/**
            - id: activity-service
              uri: lb://treatment-service
              predicates:
                - Path=/api/v1/activities/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**
            - id: reminders-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/reminders/**
            - id: report-service
              uri: lb://report-service
              predicates:
                - Path=/api/v1/reports/**
            - id: detection-service
              uri: lb://detection-service
              predicates:
                - Path=/api/v1/detections/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
