spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Commenting out global CORS configuration to avoid duplicate headers
      # globalcors:
      #   cors-configurations:
      #     "[/**]":
      #       allowedOrigins: "*"
      #       allowedMethods:
      #         - GET
      #         - POST
      #         - PUT
      #         - DELETE
      #         - OPTIONS
      #         - PATCH
      #       allowedHeaders: "*"
      #       allowCredentials: false
      # default-filters:
      #   - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://discovery-service:8761/eureka}
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:api-gateway}
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    securePortEnabled: true
    securePort: ${EUREKA_INSTANCE_SECURE_PORT:443}
    nonSecurePortEnabled: false
    preferIpAddress: false
    statusPageUrl: https://${eureka.instance.hostname}/actuator/info
    healthCheckUrl: https://${eureka.instance.hostname}/actuator/health
    homePageUrl: https://${eureka.instance.hostname}/

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: UNRESTRICTED

logging:
  level:
    "[org.springframework.cloud.gateway]": DEBUG
    "[reactor.netty]": DEBUG
