# Docker Profile Configuration for Treatment Service
server.port=8087
spring.application.name=diagnosis-treatment-service

# Eureka Configuration for Docker
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka
eureka.instance.hostname=diagnosis-treatment-service
eureka.instance.prefer-ip-address=true

# Database Configuration for Docker
spring.datasource.url=jdbc:mysql://mysql:3307/ayni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration Properties
authorization.jwt.secret=TempSecretForDevelopmentOnly123456789
authorization.jwt.expiration.days=7
