spring.application.name=diagnosis-treatment-service
server.port=8087

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Spring DataSource Configuration - SU PROPIA BD
spring.datasource.url=jdbc:mysql://localhost:3307/ayni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue Names - Solo diagnosis/treatment
rabbitmq.queue.diagnosis-notifications=diagnosis.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.routing.key.diagnosis=diagnosis.alert
rabbitmq.routing.key.treatment=treatment.reminder

# Scheduler Configuration
spring.task.scheduling.pool.size=10

# MICROSERVICE COMMUNICATION - Via REST/Feign
detection.service.url=http://localhost:8000
crop.service.url=http://localhost:8082
user.service.url=http://localhost:8081

# SpringDoc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.com.hidrogreen.diagnosis_treatment_service=DEBUG

# Additional Diagnosis Logging
logging.level.com.hidrogreen.treatment_service.diagnosis=DEBUG

# JWT Configuration Properties - USE ENVIRONMENT VARIABLES
authorization.jwt.secret=${JWT_SECRET:TempSecretForDevelopmentOnly123456789}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Service-to-Service Authentication
service.auth.secret=${SERVICE_AUTH_SECRET:ServiceSecretForInternalCommunication123}
service.auth.expiration.hours=${SERVICE_AUTH_EXPIRATION_HOURS:24}

# Cloudinary Configuration for Image Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your_api_secret}
cloudinary.folder=diagnosis-images

cloudinary.folder=diagnosis-images

cloudinary.folder=diagnosis-images

cloudinary.folder=diagnosis-images
