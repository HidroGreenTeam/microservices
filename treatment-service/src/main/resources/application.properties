# Common Configuration - Treatment Service
spring.application.name=treatment-service
server.port=8082

# Default profile for development (Docker)
spring.profiles.active=docker

# Spring DataSource Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/ayni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Spring Data JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ Configuration
spring.rabbitmq.connection-timeout=30000
spring.rabbitmq.requested-heartbeat=30

# Queue Names
rabbitmq.queue.activity-notifications=activity.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.queue.diagnosis-queue=diagnosis.queue
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.routing.key.activity=activity.reminder
rabbitmq.routing.key.treatment=treatment.reminder

# Scheduler Configuration
spring.task.scheduling.pool.size=10

# OpenAPI/Swagger is configured directly in Java code

# SpringDoc Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.com.hidrogreen.treatment_service.infrastructure.config=DEBUG

# Internal Service Token Configuration
service.internal.token=HIDROGREEN_INTERNAL_SERVICE_TOKEN_2024
