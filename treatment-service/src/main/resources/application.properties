spring.application.name=treatment-service
server.port=8082

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:https://discovery-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:treatment-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io}
eureka.instance.securePortEnabled=true
eureka.instance.securePort=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.instance.nonSecurePortEnabled=false
eureka.instance.preferIpAddress=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.statusPageUrl=https://${eureka.instance.hostname}/actuator/info
eureka.instance.healthCheckUrl=https://${eureka.instance.hostname}/actuator/health
eureka.instance.homePageUrl=https://${eureka.instance.hostname}/

# Spring DataSource Configuration
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/ayni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Spring Data JPA Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Queue Names
rabbitmq.queue.activity-notifications=activity.notifications
rabbitmq.queue.treatment-reminders=treatment.reminders
rabbitmq.exchange.notifications=notifications.exchange
rabbitmq.routing.key.activity=activity.reminder
rabbitmq.routing.key.treatment=treatment.reminder

# Scheduler Configuration
spring.task.scheduling.pool.size=10

# OpenAPI/Swagger is configured directly in Java code

# SpringDoc Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Management endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework.amqp=DEBUG
logging.level.com.rabbitmq=DEBUG
logging.level.com.hidrogreen.treatment_service.infrastructure.config=DEBUG
