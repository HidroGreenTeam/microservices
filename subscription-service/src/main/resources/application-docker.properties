# Docker specific properties

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://discovery-service:8761/eureka

# Spring DataSource Configuration
spring.datasource.url=jdbc:mysql://mysql:3306/ayni?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Spring Data JPA Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# RabbitMQ Configuration
spring.rabbitmq.host=rabbitmq

# External Services Configuration
app.services.user-service.url=http://user-service:8081

# JWT Configuration Properties
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/hidrogreen