<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful</title> <!-- Título cambiado -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        /* ... (COPIA EXACTAMENTE EL MISMO CSS DE payment.html AQUÍ) ... */
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary: #0070ba;
            --primary-hover: #005c99;
            --text-dark: #1f2833;
            --text-light: #4a5568;
            --accent: #ff9900; /* Puedes cambiar este a un color de éxito si quieres, ej. verde */
            --radius: 8px;
            --transition: 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { text-align: center; max-width: 800px; width: 100%; }
        h2 { font-size: 2rem; margin-bottom: 16px; font-weight: 600; }
        /* No necesitamos .plans, .plan-card, button aquí, pero dejarlos en el CSS no hace daño */
        #status { margin-top: 20px; font-size: 1.2rem; /* Un poco más grande para el mensaje de estado */ color: var(--text-dark); min-height: 1.2em; font-weight: 600; }
        .back-link { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: var(--primary); color: white; text-decoration: none; border-radius: var(--radius); transition: background-color var(--transition); }
        .back-link:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
<div class="container">
    <h2>Payment Successful!</h2> <!-- Encabezado cambiado -->
    <p id="status">Verifying payment details...</p>
    <a href="/" class="back-link">Make Another Payment</a> <!-- Enlace para volver -->
</div>

<script>
    // COPIA EXACTAMENTE EL MISMO SCRIPT window.onload DE payment.html AQUÍ
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const localStatusElement = document.getElementById('status');

        const internalPaymentId = urlParams.get('internalPaymentId');
        const errorMessage = urlParams.get('error'); // No se usará aquí pero el script es genérico
        const currentPath = window.location.pathname;

        if (localStatusElement) {
            if (currentPath.endsWith('/payment-success.html') && internalPaymentId) {
                localStatusElement.innerHTML = `Your payment was successful. <br>Our Payment ID: <strong>${internalPaymentId}</strong>`;
            } else if (currentPath.endsWith('/payment-success.html')) {
                localStatusElement.textContent = 'Your payment was successful.'; // Mensaje genérico si no hay ID
            }
            // Las otras condiciones (error, cancel) no se cumplirán en esta página
        }
    };
</script>
</body>
</html>
