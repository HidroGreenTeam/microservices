# Production Profile Configuration - Payment Gateway Service (Azure)

# Eureka Client Configuration for Azure
eureka.client.service-url.defaultZone=https://discovery-service.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io/eureka/
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:payment-gateway.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.securePortEnabled=true
eureka.instance.securePort=${EUREKA_INSTANCE_SECURE_PORT:443}
eureka.instance.nonSecurePortEnabled=false
eureka.instance.preferIpAddress=false
eureka.instance.statusPageUrl=https://${eureka.instance.hostname}/actuator/info
eureka.instance.healthCheckUrl=https://${eureka.instance.hostname}/actuator/health
eureka.instance.homePageUrl=https://${eureka.instance.hostname}/

# PayPal Configuration for Azure
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}

# Application URL for Azure
app.url=https://payment-gateway.thankfulwater-e8adfc7e.eastus.azurecontainerapps.io 