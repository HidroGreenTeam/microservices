<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Error</title> <!-- Título cambiado -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        /* ... (COPIA EXACTAMENTE EL MISMO CSS DE payment.html AQUÍ) ... */
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary: #0070ba;
            --primary-hover: #005c99;
            --text-dark: #1f2833;
            --text-light: #4a5568;
            --accent: #cc0000; /* Rojo para error */
            --radius: 8px;
            --transition: 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { text-align: center; max-width: 800px; width: 100%; }
        h2 { font-size: 2rem; margin-bottom: 16px; font-weight: 600; color: var(--accent); } /* Color de acento para el título de error */
        #status { margin-top: 20px; font-size: 1.2rem; color: var(--text-dark); min-height: 1.2em; }
        .back-link { margin-top: 30px; display: inline-block; padding: 10px 20px; background-color: var(--primary); color: white; text-decoration: none; border-radius: var(--radius); transition: background-color var(--transition); }
        .back-link:hover { background-color: var(--primary-hover); }
    </style>
</head>
<body>
<div class="container">
    <h2>There was an Error with Your Payment</h2> <!-- Encabezado cambiado -->
    <p id="status">Loading error details...</p>
    <a href="/" class="back-link">Try Again</a> <!-- Enlace para volver -->
</div>

<script>
    // COPIA EXACTAMENTE EL MISMO SCRIPT window.onload DE payment.html AQUÍ
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const localStatusElement = document.getElementById('status');

        const internalPaymentId = urlParams.get('internalPaymentId'); // No se usará aquí
        const errorMessage = urlParams.get('error');
        const currentPath = window.location.pathname;

        if (localStatusElement) {
            if (currentPath.endsWith('/payment-error.html') && errorMessage) {
                localStatusElement.textContent = `Error details: ${decodeURIComponent(errorMessage)}`;
            } else if (currentPath.endsWith('/payment-error.html')) {
                localStatusElement.textContent = 'An unspecified error occurred with your payment. Please try again or contact support.';
            }
            // Las otras condiciones (success, cancel) no se cumplirán en esta página
        }
    };
</script>
</body>
</html>
